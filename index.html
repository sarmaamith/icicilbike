<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     Securiti Consent Banner SDK loader
     Same pattern used on sarmaamith.github.io/contactus/.
     Reuses that tenant's tenant-uuid / domain-uuid — confirm in
     your Securiti console that this GitHub Pages origin
     (sarmaamith.github.io) is registered under that domain-uuid,
     otherwise swap in the correct one for this property.
     After load, call setConsentBannerParams({ uuid: <unique id> })
     to tag the visitor once you know their mobile number.
     ============================================================ -->
<script>
(function () {
	var s = document.createElement('script');
	s.src = 'https://cdn-prod.securiti.ai/consent/cookie-consent-sdk-loader.js';
	s.setAttribute('data-tenant-uuid', '09f99b07-9b72-4dd3-b6b5-1009a96c2fd4');
	s.setAttribute('data-domain-uuid', 'a7b4a422-8f08-443a-9700-4223aeb926e3');
	s.setAttribute('data-backend-url', 'https://app.securiti.ai');
	s.setAttribute('data-skip-css', 'false');
	s.defer = true;
	var parent_node = document.head || document.body;
	parent_node.appendChild(s);
})()
</script>
<meta charset="UTF-8">
<title>Get a Quote</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .field {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d9dde2;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    margin-bottom: 8px;
    outline: none;
  }
  .field::placeholder {
    color: #9aa1a8;
  }
  .field:focus {
    border-color: #e8621d;
  }
  .link-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 20px;
  }
  a.link {
    color: #e8621d;
    text-decoration: underline;
    font-weight: 600;
  }
  .label {
    font-size: 12px;
    color: #e8621d;
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }
  .mobile-field {
    border-color: #e8621d;
    border-width: 2px;
    margin-bottom: 24px;
  }
  .btn {
    width: 100%;
    background: #e8621d;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .btn:hover {
    background: #d5560f;
  }
  .btn:disabled {
    background: #eabb9c;
    cursor: not-allowed;
  }
  .retrieve {
    display: block;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #333;
    margin-bottom: 12px;
  }
  .checkbox-row input {
    accent-color: #e8621d;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .whatsapp {
    color: #25D366;
    font-weight: 600;
  }
  .status-msg {
    font-size: 12px;
    text-align: center;
    margin-top: -8px;
    margin-bottom: 16px;
    min-height: 14px;
  }
  .status-msg.error { color: #c0392b; }
  .status-msg.success { color: #1e8449; }

  /* ---------- DPDPA re-consent popup (shown on "Get quote") ---------- */
  .dpdpa-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1500;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .dpdpa-overlay.active { display: flex; }
  .dpdpa-box {
    background: #fff;
    max-width: 480px;
    width: 100%;
    border-radius: 8px;
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .dpdpa-box p {
    margin: 0 0 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #222;
  }
  .dpdpa-consent-line {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #333;
    margin-bottom: 22px;
  }
  .dpdpa-consent-line input {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    flex-shrink: 0;
    accent-color: #e8621d;
  }
  .dpdpa-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .dpdpa-no-btn, .dpdpa-yes-btn {
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  .dpdpa-no-btn { background: #e04f5f; }
  .dpdpa-no-btn:hover { background: #c9404f; }
  .dpdpa-yes-btn { background: #2fa84f; }
  .dpdpa-yes-btn:hover { background: #268f42; }
</style>
</head>
<body>
<div class="card">
  <form id="quoteForm">
    <input class="field" id="vehicleReg" type="text" placeholder="Vehicle registration number">
    <div class="link-row">
      <a href="#" class="link">Got a new vehicle</a>
      <a href="#" class="link">What is this?</a>
    </div>
    <span class="label">Mobile number</span>
    <input class="field mobile-field" id="mobileNumber" type="tel" pattern="[0-9]{10}" maxlength="10" required>
    <button class="btn" type="submit" id="submitBtn">Get quote</button>
    <div class="status-msg" id="statusMsg"></div>
    <a href="#" class="link retrieve">Retrieve quote</a>
    <label class="checkbox-row">
      <input type="checkbox" id="consentTerms" checked>
      <span>I agree to the <a href="#" style="color:#333; text-decoration: underline;">terms and conditions</a></span>
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="consentWhatsapp" checked>
      <span>I want to receive updates on <span class="whatsapp">&#128222; WhatsApp</span></span>
    </label>
  </form>
</div>

<!-- ============================================================
     DPDPA re-consent popup — shown when "Get quote" is clicked
     (after the form fields themselves pass validation).
     ============================================================ -->
<div class="dpdpa-overlay" id="dpdpaOverlay">
  <div class="dpdpa-box">
    <p>
      In light of recent changes to the DPDPA (Digital Personal Data
      Protection Act) policies, a new consent is being collected from
      you for the processing of your personal data. Do you agree to proceed?
    </p>
    <label class="dpdpa-consent-line">
      <input type="checkbox" id="dpdpaTermsCheckbox" checked>
      <span>
        I consent to the collection, use, and processing of my personal
        data by ICICI Lombard General Insurance Company Limited in
        accordance with the Digital Personal Data Protection Act (DPDPA),
        2023, for the purpose of processing my insurance quote request.
      </span>
    </label>
    <div class="dpdpa-actions">
      <button type="button" class="dpdpa-no-btn" id="dpdpaNoBtn">No</button>
      <button type="button" class="dpdpa-yes-btn" id="dpdpaYesBtn">Yes</button>
    </div>
  </div>
</div>

<script>
(function () {
  // ============================================================
  // Securiti consent_upload — same endpoint/header shape as the
  // Godrej Chemicals reference script.
  //
  // SECURITY NOTE: this runs client-side on a public GitHub Pages
  // site, so anything in SECURITI_HEADERS is visible to anyone who
  // views source / opens devtools. For a real deployment, proxy
  // this call through a small backend (Cloudflare Worker, Lambda,
  // etc.) that holds the real key/secret server-side, and have the
  // page call that proxy instead of app.securiti.ai directly.
  // ============================================================
  const SECURITI_ENDPOINT = 'https://app.securiti.ai/privaci/v1/consentapi/consent_upload';
  const SECURITI_HEADERS = {
    'X-API-Key':    'GYsPcqTmOKEXcXq7M15ElbXOsga80rk0W367rmk9',
    'X-API-Secret': '85fzFjPye5XzO8yjXLsa9bP0Ol3zcPjl5Yd17bXM',
    'X-TIDENT':     '09f99b07-9b72-4dd3-b6b5-1009a96c2fd4',
    'Content-Type': 'application/json'
  };
  const FORM_SELECTOR = '#quoteForm';
  const inFlight = new WeakSet();

  // ============================================================
  // readForm — pull field/checkbox values by id
  // ============================================================
  function readForm(form) {
    const get = function (id) {
      const el = form.querySelector('#' + id);
      return el && el.value ? el.value.trim() : '';
    };
    const checked = function (id) {
      const el = form.querySelector('#' + id);
      return !!(el && el.checked);
    };
    return {
      vehicleReg:       get('vehicleReg'),
      mobile:           get('mobileNumber'),
      termsGranted:     checked('consentTerms'),
      whatsappGranted:  checked('consentWhatsapp')
    };
  }

  // ============================================================
  // isValid — mobile number required and must be 10 digits;
  // terms checkbox must be ticked to proceed
  // ============================================================
  function isValid(fields) {
    if (!fields.mobile) return false;
    if (!/^[0-9]{10}$/.test(fields.mobile)) return false;
    if (!fields.termsGranted) return false;
    return true;
  }

  // ============================================================
  // buildPayload — Securiti consent_upload schema. Terms, WhatsApp,
  // and the DPDPA popup checkbox are all reported as the visitor
  // actually set them (not hardcoded true).
  // dpdpaGranted comes from the popup's checkbox, captured right
  // before this payload is sent.
  // ============================================================
  function buildPayload(fields, dpdpaGranted) {
    return {
      UUID: fields.mobile,
      uuids: {
        mobile_number:               fields.mobile,
        vehicle_registration_number: fields.vehicleReg
      },
      activity_timestamp: Math.floor(Date.now() / 1000),
      consent_source: 'Vehicle Insurance Quote WebForm',
      consent_info: [
        {
          processing_purpose_name: 'Insurance Quote Request',
          consented_items: [
            { consent_purpose_name: 'Terms and Conditions', consent_granted: fields.termsGranted }
          ]
        },
        {
          processing_purpose_name: 'Marketing Communication',
          consented_items: [
            { consent_purpose_name: 'WhatsApp', consent_granted: fields.whatsappGranted }
          ]
        },
        {
          processing_purpose_name: 'DPDPA Re-Consent',
          consented_items: [
            { consent_purpose_name: 'Terms and Conditions', consent_granted: dpdpaGranted }
          ]
        }
      ]
    };
  }

  // ============================================================
  // uploadConsent — POST to Securiti
  // ============================================================
  async function uploadConsent(payload) {
    const response = await fetch(SECURITI_ENDPOINT, {
      method:  'POST',
      headers: SECURITI_HEADERS,
      body:    JSON.stringify(payload)
    });
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error('Securiti ' + response.status + ': ' + errorText);
    }
    return response.json();
  }

  // ============================================================
  // DPDPA popup elements + open/close helpers
  // ============================================================
  const dpdpaOverlay  = document.getElementById('dpdpaOverlay');
  const dpdpaYesBtn   = document.getElementById('dpdpaYesBtn');
  const dpdpaNoBtn    = document.getElementById('dpdpaNoBtn');
  const dpdpaTermsBox = document.getElementById('dpdpaTermsCheckbox');

  function openDpdpaModal() { dpdpaOverlay.classList.add('active'); }
  function closeDpdpaModal() { dpdpaOverlay.classList.remove('active'); }

  // Holds the form/fields/statusMsg/submitBtn for whichever submit
  // triggered the popup, so the Yes/No handlers know what to act on.
  let pendingSubmission = null;

  // ============================================================
  // Submit handler — validate fields first, then show the DPDPA
  // popup instead of uploading consent right away. The actual
  // upload now happens from the popup's "Yes" button.
  // ============================================================
  document.addEventListener('submit', function (event) {
    const form = event.target;
    if (!form || !form.matches || !form.matches(FORM_SELECTOR)) return;
    event.preventDefault();
    if (inFlight.has(form)) return; // duplicate-click guard

    const statusMsg = form.querySelector('#statusMsg');
    const submitBtn = form.querySelector('#submitBtn');
    const fields = readForm(form);

    if (!isValid(fields)) {
      statusMsg.textContent = !fields.mobile || !/^[0-9]{10}$/.test(fields.mobile)
        ? 'Please enter a valid 10-digit mobile number.'
        : 'You must agree to the terms and conditions to continue.';
      statusMsg.className = 'status-msg error';
      return;
    }

    statusMsg.textContent = '';
    dpdpaTermsBox.checked = true; // reset popup checkbox to its default each time it's shown
    pendingSubmission = { form, fields, statusMsg, submitBtn };
    openDpdpaModal();
  }, true);

  // ============================================================
  // "No" — close the popup, don't upload consent, don't proceed.
  // ============================================================
  dpdpaNoBtn.addEventListener('click', function () {
    closeDpdpaModal();
    if (pendingSubmission && pendingSubmission.statusMsg) {
      pendingSubmission.statusMsg.textContent = 'You must accept the DPDPA consent to get a quote.';
      pendingSubmission.statusMsg.className = 'status-msg error';
    }
    pendingSubmission = null;
  });

  // ============================================================
  // "Yes" — capture consent (including the DPDPA popup checkbox)
  // and upload it to Securiti.
  // ============================================================
  dpdpaYesBtn.addEventListener('click', function () {
    if (!pendingSubmission) { closeDpdpaModal(); return; }

    const { form, fields, statusMsg, submitBtn } = pendingSubmission;
    const dpdpaGranted = dpdpaTermsBox.checked;
    closeDpdpaModal();

    if (!dpdpaGranted) {
      statusMsg.textContent = 'You must accept the DPDPA consent to get a quote.';
      statusMsg.className = 'status-msg error';
      pendingSubmission = null;
      return;
    }

    inFlight.add(form);
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const payload = buildPayload(fields, dpdpaGranted);

    uploadConsent(payload)
      .then(function (result) {
        console.log('Consent recorded (quote):', result);
        statusMsg.textContent = 'Consent recorded. Fetching your quote...';
        statusMsg.className = 'status-msg success';
        // TODO: continue with the real quote flow here (redirect / API call).
      })
      .catch(function (err) {
        console.error('Consent upload failed:', err);
        statusMsg.textContent = 'Something went wrong recording consent. Please try again.';
        statusMsg.className = 'status-msg error';
      })
      .finally(function () {
        inFlight.delete(form);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get quote';
        pendingSubmission = null;
      });
  });
})();
</script>
</body>
</html>
